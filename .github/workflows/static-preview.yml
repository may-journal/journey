# may-journal/.github holds the source copy in templates/static-site and syncs
# it whole to each static site that opts in, so edit it there. A public repo
# cannot call a private repo's workflow, which is why it is synced whole.

# A site's Pages workflow uploads its build and calls this file, which
# publishes main at the root and each pull request under pr/<number>/. Each
# pull request gets one comment linking its preview, and closing it removes
# the folder.

# A fork's pull request gets a read-only token, so it gets no preview. The
# caller grants contents and pull-requests write and pages read, on push to
# main and on pull_request opened, synchronize, reopened and closed.
name: Static preview

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the uploaded artifact that holds the built site.
        type: string
        default: site

permissions: {}

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNNER && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      pages: read
    # Runs for one pull request, or for main, go one at a time, so a close
    # never races that pull request's last push. Runs for different folders
    # can overlap, so the publish step retries a rejected push.
    concurrency:
      group: static-preview-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event_name == 'pull_request' && format('pr/{0}', github.event.pull_request.number) || '.' }}
      CLOSED: ${{ github.event.action == 'closed' }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # An open pull request runs the scripts of its merge with main, and a
      # closed one, with no fresh merge, runs main's.
      - name: Check out the preview scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.action == 'closed' && github.event.repository.default_branch || '' }}
          sparse-checkout: |
            scripts/static-preview-publish.sh
            scripts/static-preview-link.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # While main has none, as when the sync pull request closes unmerged,
      # a closed one runs its own head's.
      - name: Check out the closed pull request's preview scripts
        if: github.event.action == 'closed' && hashFiles('scripts/static-preview-publish.sh') == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            scripts/static-preview-publish.sh
            scripts/static-preview-link.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download the built site
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/site
      - name: Publish to gh-pages
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          SITE: ${{ runner.temp }}/site
          PAGES: ${{ runner.temp }}/gh-pages
        run: scripts/static-preview-publish.sh
      - name: Link the preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: scripts/static-preview-link.sh
      - name: Report the preview outcome
        if: always()
        run: echo "Publishing ${TARGET} at ${SHA} finished with status ${{ job.status }}." >> "$GITHUB_STEP_SUMMARY"
