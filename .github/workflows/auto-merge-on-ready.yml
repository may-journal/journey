# Shared by every may-journal repo. may-journal/.github holds the source copy,
# and org-settings opens a PR in each repo whose copy differs. Edit it there.
# The org ruleset never starts auto-merge.yml on ready_for_review, so a draft
# marked ready would not get auto-merge. This caller runs it on that event.
# GitHub also sends an edited event when a merged base moves a stacked PR onto
# main. The job runs for it only when the base changed, so body edits cost
# no Actions minutes.
# pull_request_target runs the base branch's copy and checks out no PR code.
# An approval runs it too, so a native stack merges once its last PR is
# approved. GitHub has no pull_request_target form of a review event, so that
# run uses the PR branch's own copy of this file. Only approvals of this
# repo's branches run, since a fork's PR gets no secrets; a writer to this
# repo can already run its own workflows with them.
name: Auto-merge on ready
on:
  pull_request_target:
    types: [ready_for_review, edited]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  auto-merge:
    if: >-
      (github.event_name == 'pull_request_target'
      && (github.event.action != 'edited' || github.event.changes.base))
      || (github.event_name == 'pull_request_review'
      && github.event.review.state == 'approved'
      && github.event.pull_request.head.repo.full_name == github.repository)
    uses: may-journal/fitness-runner/.github/workflows/auto-merge.yml@v1
    secrets: inherit
