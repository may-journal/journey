# may-journal/.github holds the source copy, and org-settings opens a PR
# wherever a repo's copy differs, so edit it there. The org ruleset never
# starts auto-merge.yml on ready_for_review, so this caller runs it when a
# draft is marked ready.
name: Auto-merge on ready
on:
  # pull_request_target runs the base branch's copy and checks out no PR
  # code. An edited event runs the job only when a merged base moved the PR
  # onto main, so body edits cost no minutes.
  pull_request_target:
    types: [ready_for_review, edited]
  # An approval runs it too, so a native stack merges once its last PR is
  # approved. A review event uses the PR branch's copy, so only this repo's
  # branches run, since a fork's PR gets no secrets.
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  auto-merge:
    # A writer to this repo can already run its own workflows with its
    # secrets, so trusting its branches adds no exposure.
    if: >-
      (github.event_name == 'pull_request_target'
      && (github.event.action != 'edited' || github.event.changes.base))
      || (github.event_name == 'pull_request_review'
      && github.event.review.state == 'approved'
      && github.event.pull_request.head.repo.full_name == github.repository)
    uses: may-journal/fitness-runner/.github/workflows/auto-merge.yml@v1
    secrets: inherit
