# Shared by every may-journal repo. may-journal/.github holds the source copy,
# and org-settings opens a PR in each repo whose copy differs. Edit it there.
# Org required workflows skip issue events, so each repo carries this caller.
# It notes when a new issue resembles an older one. A repo whose fitness
# config file sets dupeCheck.closeScore also closes a newly opened issue
# as a duplicate; that tier is off by default. A manual run writes nothing.
name: Dupe check
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
jobs:
  dupe-check:
    uses: may-journal/fitness-runner/.github/workflows/dupe-check-reusable.yml@v1
    permissions:
      contents: read
      issues: write
