# may-journal/.github holds the source copy, and org-settings opens a PR
# wherever a repo's copy differs, so edit it there. Org required workflows
# skip issue events, so each repo carries this caller to reopen an issue
# closed with unchecked items.
name: Close check
on:
  issues:
    types: [closed]
jobs:
  close-check:
    uses: may-journal/fitness-runner/.github/workflows/close-check-reusable.yml@v1
    permissions:
      contents: read
      issues: write
      pull-requests: read
